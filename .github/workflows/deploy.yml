name: Deploy Soocher Web

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 139.59.0.173
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/soocher/web
            git pull origin main
            rm -rf .next node_modules package-lock.json
            npm cache clean --force
            npm install
            npm run build
            sudo fuser -k 5000/tcp || true
            supervisorctl restart soocher-web
